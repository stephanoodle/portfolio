<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}
  <title>{{ site.title }}</title>
  {% else %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% unless page.url == "/" %}<a class="back" href="{{ '/' | relative_url }}">All case studies</a>{% endunless %}
  </header>
  <main class="{% if page.url == '/' %}home{% else %}prose{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <a href="mailto:stephanie@geekazoid.net">stephanie@geekazoid.net</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.linkedin.com/in/stephanie-j-coulter/">LinkedIn</a>
  </footer>
</body>
</html>
