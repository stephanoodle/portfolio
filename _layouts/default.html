<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}
  <title>{{ site.title }} · Support, documentation, and AI knowledge</title>
  {% else %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23B8552F'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23FBF7F1' font-family='Georgia,serif'>S</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">Stephanie Coulter</a>
      <nav aria-label="Sections">
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/#writing' | relative_url }}">Writing</a>
        <a href="{{ '/#kind-words' | relative_url }}">Kind words</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a class="nav-contact" href="mailto:stephanie@geekazoid.net">Say hello</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-line">Thanks for reading.</p>
      <p class="footer-links">
        <a href="mailto:stephanie@geekazoid.net">stephanie@geekazoid.net</a>
        <a href="https://www.linkedin.com/in/stephanie-j-coulter/">LinkedIn</a>
      </p>
    </div>
  </footer>
</body>
</html>
